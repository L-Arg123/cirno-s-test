<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>琪露诺の挑战</title>
<link rel="stylesheet" href="attached/style.css">
</head>
<body>

<!-- ===================== 背景 + 装饰层（都在 UI 下层，不挡按钮） ===================== -->
<div id="bgWrap" aria-hidden="true">
  <!-- B.jpg：虚化 + 倒置当背景。想改成"颜色反相"，把 style.css 里 #bgImg 的
       transform:scaleY(-1) 换成 filter 里加 invert(1) 即可 -->
  <img id="bgImg" src="ex/picture/B.jpg" alt="">
</div>

<!-- 固定装饰（fumo 照片卡）：点一下会播 baka.mp3（带 class="deco-click" 的都算） -->
<div id="decoCorners" aria-hidden="true">
  <img class="deco deco-click d-tl"  src="ex/picture/B1.gif"      alt="">
  <img class="deco deco-click d-tr"  src="ex/picture/B2.gif"      alt="">
  <img class="deco deco-click d-tr2" src="ex/picture/single2.gif" alt="">
  <img class="deco deco-click d-ml"  src="ex/picture/B6.gif"      alt="">
  <img class="deco deco-click d-mr"  src="ex/picture/BA.gif"      alt="">
  <img class="deco deco-click d-bl"  src="ex/picture/B3.gif"      alt="">
  <img class="deco deco-click d-br"  src="ex/picture/B4.gif"      alt="">
  <img class="deco deco-click d-bl2" src="ex/picture/T.gif"       alt="">
  <img class="deco deco-click d-br2" src="ex/picture/F1.gif"      alt="">
  <img class="deco deco-click d-bc"  src="ex/picture/BA1.jpg"     alt="">
</div>

<!-- 慢速弹球：B5.gif 在屏幕上碰来碰去（同样在 UI 下层）
     bouncer  = 左上出发的那只
     bouncer2 = 第二只，从左下出发、初始方向每次刷新都随机
     两只在所有界面都会一直飘，不会切屏就消失。 -->
<img id="bouncer" src="ex/picture/B5.gif" alt="">
<img id="bouncer2" src="ex/picture/B5.gif" alt="">

<!-- baka 音效由 game.js 建"播放器池"（可叠音），不需要在这里放 audio 元素 -->

<!-- ===================== 右上角：音乐 + 信息 ===================== -->
<div class="topbar">
  <div class="music-widget">
    <button id="musicToggle" class="icon-btn" title="播放 / 暂停">
      <!-- 音符图标：想换成你画的图，把下面的 svg 换成 <img src="assets/note.png"> 即可 -->
      <svg class="note-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 18.5V6.2l9-2.2v12.1" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="6.6" cy="18.6" rx="2.7" ry="2.2" fill="currentColor"/>
        <ellipse cx="15.6" cy="16.4" rx="2.7" ry="2.2" fill="currentColor"/>
      </svg>
      <span class="note-slash" aria-hidden="true"></span>
    </button>
    <button id="musicArrow" class="icon-btn small-arrow" title="选择音乐">▼</button>

    <!-- 菜单项由 game.js 按 TRACKS 自动生成（无音乐 + 4 首） -->
    <div id="musicMenu" class="popup-menu hidden"></div>
  </div>

  <button id="infoBtn" class="icon-btn info-btn" title="关于">i</button>
</div>

<!-- ===================== 首页 ===================== -->
<main id="screenTitle" class="screen active">
  <div class="title-badge">⑨</div>
  <h1 class="game-title">琪露诺の挑战</h1>
  <p class="game-sub">用 4 个数字凑出 9</p>
  <button id="startBtn" class="big-btn">开始游玩</button>
  <p class="footnote">企划 / 程序设计 / 题库：本项目自制　·　角色：琪露诺（⑨）</p>
</main>

<!-- ===================== 选关 ===================== -->
<main id="screenSelect" class="screen">
  <h2 class="screen-title">选择关卡</h2>
  <div class="level-row" id="levelRowTop"></div>
  <div class="level-row" id="levelRowBottom"></div>
  <p class="hint-line">前三关鼓励多解（做得越多分越高）；后四关只要拼出全部即可，多一组解有额外加成。</p>
  <button id="backToTitle" class="ghost-btn">返回首页</button>
</main>

<!-- ===================== 游玩 ===================== -->
<main id="screenGame" class="screen">
  <header class="hud">
    <button id="quitBtn" class="ghost-btn small">退出</button>
    <div class="hud-mid">
      <div id="levelName" class="hud-level">第一关 · normal</div>
      <div id="roundInfo" class="hud-round">要拼出 1 个 9</div>
    </div>
    <div class="hud-right">
      <div id="timerText" class="hud-timer">—</div>
      <div id="scoreText" class="hud-score">0 分</div>
    </div>
  </header>

  <div class="timerbar"><div id="timerFill"></div></div>

  <section class="puzzle-area">
    <div id="puzzleNums" class="puzzle-nums"></div>
    <div id="puzzleMeta" class="puzzle-meta"></div>
  </section>

  <section class="answer-area">
    <div class="area-label">把每组 4 个数拼成 9（点数字和运算符，按 = 检查这一组）</div>
    <div id="slots" class="slots"></div>
  </section>

  <section class="palette-area">
    <div class="palette-col">
      <div class="area-label">数字</div>
      <div id="numPad" class="num-pad"></div>
    </div>
    <div class="palette-col">
      <div class="area-label">运算符</div>
      <div id="opPad" class="op-pad"></div>
    </div>
    <div class="action-col">
      <button id="delBtn" class="ghost-btn small">← 删除</button>
      <button id="clearBtn" class="ghost-btn small">清空</button>
      <button id="extraBtn" class="bonus-btn" disabled>再来一种解法</button>
      <button id="giveUpBtn" class="ghost-btn small">放弃</button>
      <button id="doneBtn" class="big-btn small">完成</button>
    </div>
  </section>

  <div id="hintBar" class="hint-bar"></div>
</main>

<!-- ============ 胜利画面：baka 视频 + 左右下角两只 T 动图 ============
     图层顺序：视频(最下) < 两只 T 动图 < 提示框/结算框（弹窗 z-index 60）
     src 由 game.js 用 encodeURI 设置（文件名里有 🧊，直接写在这里也行但 js 里更稳） -->
<div id="winLayer" class="hidden" aria-hidden="true">
  <video id="winVideo" playsinline muted loop preload="none"></video>
  <img class="win-t win-tl" src="ex/picture/T.gif" alt="">
  <img class="win-t win-tr" src="ex/picture/T.gif" alt="">
</div>

<!-- ===================== 通用弹窗 ===================== -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="modalMini" class="mini-toggle" title="把提示框变透明">−</button>
    <div class="modal-inner">
      <div id="modalSprite" class="modal-sprite"></div>
      <h3 id="modalTitle" class="modal-title">标题</h3>
      <p id="modalText" class="modal-text"></p>
      <div class="modal-actions">
        <button id="modalOk" class="big-btn small">确定</button>
        <button id="modalCancel" class="ghost-btn small hidden">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- ===================== 结算画面 ===================== -->
<div id="resultScreen" class="modal hidden">
  <div class="modal-box result-box">
    <button id="resultMini" class="mini-toggle" title="把结算框变透明">−</button>
    <div class="modal-inner">
      <h3 id="resultTitle" class="modal-title">结算</h3>
      <div id="resultBody" class="result-body"></div>
      <div class="modal-actions">
        <button id="resultRetry" class="big-btn small">重玩本关</button>
        <button id="resultBack" class="ghost-btn small">返回选关</button>
      </div>
    </div>
  </div>
</div>

<script src="attached/puzzles.js"></script>
<script src="attached/game.js"></script>
</body>
</html>
